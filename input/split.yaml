meta:
  engine: "4.0.0"

units:
  # Proxy spacing vars (MX: use u/u; Choc: cx/cy)
  kx: cx # 18
  ky: cy # 17
  px: kx + 2
  py: ky + 2
  cutout: 13.8
  cutout_offset: cutout / 2

points:
  zones:
    matrix:
      anchor: {}
      key:
        padding: 1 ky
        spread: 1 kx
      rows:
        bottom: {}
        home: {}
        top: {}
      columns:
        pinky:
          rows:
            top:
              skip: true
            home: {}
            bottom:
              asym: source
          key:
            splay: 5
        ring:
          rows: {}
          key:
            splay: -4
            spread: 1.1 kx
            stagger: 0.5 ky
        middle:
          rows: {}
          key:
            splay: -2
            spread: 1.05 kx
            stagger: 0.2 ky
        index:
          rows: {}
          key:
            splay: -1
            spread: 1.04 kx
            stagger: -0.1 ky
        thumb:
          rows:
            bottom: {}
            home: {}
            top:
              skip: true
          key:
            splay: -100
            spread: 0.75 kx
            stagger: -1.2 ky

    board:
      anchor:
        ref: matrix_index_home
        shift: [21, -0.8 ky]
      key:
        padding: 1 ky
        spread: 1 kx
      rows:
        mcu: {}
      columns:
        component:
          rows:
            mcu:
              shift: [0, 0.5 ky]

  mirror:
    ref: matrix_index_home
    distance: 90

outlines:
  keys:
    - what: rectangle
      where: "-/board/"
      joints: 1
      size: [kx - 0.5, ky - 0.5]

  _hull_left:
    - &hull_left_poly
      what: polygon
      points:
        - ref: matrix_pinky_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: matrix_pinky_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_home
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_thumb_home
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_thumb_bottom
          shift: [-cutout_offset, -cutout_offset - 1]
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  _hull_right:
    - &hull_right_poly
      what: polygon
      points:
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_ring_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_home
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_thumb_home
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_thumb_bottom
          shift: [-cutout_offset, -cutout_offset - 1]
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  top_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
      expand: 4
      fillet: 4
    - operation: subtract
      what: rectangle
      where: "-/board/"
      joints: 1
      size: [cutout, cutout]
    - operation: add
      what: rectangle
      where: "/board/"
      size: [18, 25 + 5]

  pcb:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - operation: add
      what: rectangle
      where: "/board/"
      size: [20, 25 + 5 + 12]
      adjust:
        shift: [-2, -8]
      expand: 3
      fillet: 3
