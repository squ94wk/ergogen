meta:
  engine: "4.0.0"

units:
  kx: cx # 18
  ky: cy # 17
  cap_x: cx - 0.5
  cap_y: cy - 0.5
  cutout: 13.8
  cutout_offset: cutout / 2
  # sideways
  mcu_y: 18
  mcu_x: 24
  mcu_offset: 1.2
  usb_breakout_x: 14
  usb_breakout_y: 20
  usb_breakout_offset_x: 3
  usb_breakout_offset_y: 2
  usb_plate_inlet: -5

points:
  key:
    padding: 1 ky
    spread: 1 kx
  zones:
    matrix:
      anchor:
        shift: [ 100, -100 ]
      rows:
        bottom: {}
        home: {}
        top: {}
      columns:
        pinky:
          rows:
            top:
              skip: true
            home: {}
            bottom:
              asym: source
          key:
            splay: 4
        ring:
          rows: {}
          key:
            splay: -2
            spread: 1 kx + 1
            stagger: 11
        middle:
          rows: {}
          key:
            splay: -2
            spread: 1 kx + 1
            stagger: 3
        index:
          rows: {}
          key:
            splay: -2
            spread: kx + 1
            stagger: -2
        thumb_home:
          rows:
            bottom: {}
            home:
              skip: true
            top:
              skip: true
          key:
            splay: -10
            stagger: -1.2ky
            spread: 0.9 kx
        thumb_outer:
          rows:
            bottom: {}
            home:
              skip: true
            top:
              skip: true
          key:
            splay: -4
            stagger: -0.75
            spread: 1 kx + 1

    board:
      anchor:
        ref: matrix_index_bottom
        shift: [kx/2 + 8 + mcu_x, -cutout/2 - 1] # anchor is outer edge; inner edge is 7mm from row
      key:
        padding: usb_breakout_y + usb_breakout_offset_y
      columns:
        component:
          rows:
            usb: {}
            mcu: {}

  mirror:
    ref: matrix_index_home
    distance: 110

outlines:
  keys:
    - what: rectangle
      where: "/matrix/"
      joints: 1
      size: [cap_x, cap_y]
      corner: 1

  _key_cutouts:
    - what: rectangle
      where: "/matrix/"
      joints: 1
      size: [cutout, cutout]

  _board:
    - what: rectangle
      where: "/board_component_mcu/"
      joints: 1
      size: [mcu_x, mcu_y]
      adjust:
        shift: [-mcu_x/2, mcu_y/2] # origin is bottom right
    - what: rectangle # protruding USB connector
      where: "/board_component_mcu/"
      joints: 1
      size: [8.63, 1]
      adjust:
        shift: [-mcu_x/2, mcu_y + 0.5] # center of MCU top

  _mcu:
    - what: rectangle
      where: "/board_component_mcu/"
      joints: 0
      size: [mcu_x, mcu_y]
      adjust:
        shift: [-mcu_x/2, mcu_y/2] # origin is bottom right
      corner: 1
  _mcu_plug:
    - &mcu_plug
      what: rectangle # protruding USB plug
      where: "/board_component_mcu/"
      joints: 1
      size: [8.63, 8]
      adjust:
        shift: [-8/2+1, mcu_y/2] # center of MCU top
        rotate: 90
  _usb:
    - what: rectangle # usb connector
      where: "/board_component_usb/"
      joints: 0
      size: [usb_breakout_x, usb_breakout_y]
      adjust:
        shift: [-usb_breakout_x/2 + usb_breakout_offset_x, usb_breakout_y/2]
      corner: 1
  _usb_plug:
    - &usb_plug
      what: rectangle # protruding USB plug
      where: "/board_component_usb/"
      joints: 1
      size: [8.63, 8]
      adjust:
        shift: [-8/2 + usb_breakout_offset_x, usb_breakout_y/2] # center of MCU top
        rotate: 90

  _board_usb:
    - name: _mcu
    - operation: stack
      name: _mcu_plug
    - name: _usb
    - operation: stack
      name: _usb_plug

  _usb_cable:
    - what: rectangle # USB cable
      where: "/board_component_mcu/"
      joints: 1
      size: [12, 19]
      adjust:
        shift: [-mcu_x/2, mcu_y + 1 + 19/2] # starting at USB connector

  board:
#    - name: _board
#    - name: _usb_cable
    - name: _board_usb

  _hull_left:
    - &hull_left_poly
      what: polygon
      points:
        - ref: matrix_pinky_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: matrix_pinky_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_home_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_thumb_home_bottom
          shift: [-cutout_offset + 6, cutout_offset]
        - ref: matrix_index_bottom
          shift: [cutout_offset, 0]
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  _hull_right:
    - &hull_right_poly
      what: polygon
      points:
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_home_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_thumb_home_bottom
          shift: [-cutout_offset + 6, cutout_offset]
        - ref: mirror_matrix_index_bottom
          shift: [cutout_offset, 0]
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  _holes_normal:
    - &m25_hole
      what: circle
      radius: 2.5/2
      where: &hole_pinky_home_left
        ref: matrix_pinky_home
        shift: [-5, 14]
    - <<: *m25_hole
      where: &hole_ring_top_left
        ref: matrix_ring_top
        shift: [-13, 3]
    - <<: *m25_hole
      where: &hole_ring_bottom_left
        ref: matrix_pinky_bottom
        shift: [12, -10.5]
    - <<: *m25_hole
      where: &hole_index_bottom_left
        ref: matrix_thumb_home_bottom
        shift: [-13, -9.75]
    - <<: *m25_hole
      where: &hole_top_inner_left
        ref: matrix_index_top
        shift: [15.5, 6]
    - <<: *m25_hole
      where: &hole_thumb_home_bottom_left
        ref: matrix_index_bottom
        shift: [15.5, -5]
    # right side
    - <<: *m25_hole
      where: &hole_pinky_home_right
        ref: mirror_matrix_pinky_home
        shift: [-5, 14]
    - <<: *m25_hole
      where: &hole_pinky_bottom_right
        ref: mirror_matrix_pinky_home
        shift: [4, -14.5]
    - <<: *m25_hole
      where: &hole_ring_top_right
        ref: mirror_matrix_ring_top
        shift: [-13, 3]
    - <<: *m25_hole
      where: &hole_index_bottom_right
        ref: mirror_matrix_thumb_home_bottom
        shift: [-13, -9]
    - <<: *m25_hole
      where: &hole_top_inner_right
        ref: mirror_matrix_index_top
        shift: [15.5, 6]
    - <<: *m25_hole
      where: &hole_thumb_home_bottom_right
        ref: mirror_matrix_index_bottom
        shift: [15.5, -5]
    # USB
    - <<: *m25_hole
      where: &hole_mcu_cover_top_left
        ref: board_component_mcu
        shift: [-2, mcu_y + 4]
    - <<: *m25_hole
      where: &hole_mcu_cover_top_right
        ref: mirror_board_component_mcu
        shift: [-2, mcu_y + 4]
    - <<: *m25_hole
      where: &hole_mcu_cover_middle_left
        ref: board_component_usb
        shift: [-2.3 + usb_breakout_offset_x, usb_breakout_y - 2.3]
    - <<: *m25_hole
      where: &hole_mcu_cover_bottom_left
        ref: board_component_usb
        shift: [-2.3 + usb_breakout_offset_x, 2.3]
    - <<: *m25_hole
      where: &hole_mcu_cover_middle_right
        ref: mirror_board_component_usb
        shift: [-2.3 + usb_breakout_offset_x, usb_breakout_y - 2.3]
    - <<: *m25_hole
      where: &hole_mcu_cover_bottom_right
        ref: mirror_board_component_usb
        shift: [-2.3 + usb_breakout_offset_x, 2.3]

  _holes_mcu_reset:
    - &hole_reset
      what: circle
      radius: 1
      where: &hole_mcu_reset_left_1
        ref: board_component_mcu
        shift: [-mcu_x + 7.5, mcu_y/2 + 4.5]
    - <<: *hole_reset
      where: &hole_mcu_reset_left_2
        ref: board_component_mcu
        shift: [-mcu_x + 7.5, mcu_y/2 + -4.5]
    - <<: *hole_reset
      where: &hole_mcu_reset_right_1
        ref: mirror_board_component_mcu
        shift: [-mcu_x + 7.5, mcu_y/2 + 4.5]
    - <<: *hole_reset
      where: &hole_mcu_reset_right_2
        ref: mirror_board_component_mcu
        shift: [-mcu_x + 7.5, mcu_y/2 + -4.5]

  _holes:
    - name: _holes_normal

  _through_holes:
    - name: _holes
      expand: 0.2 # 2.9

  _screws:
    - name: _holes
      expand: 1.25 # 4.7

  bottom_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - &board_back_fill_left_poly
      what: polygon
      points:
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_index_bottom
          shift: [0, -cutout_offset]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: board_component_usb
          shift: [usb_breakout_offset_x + usb_plate_inlet, 0 + usb_plate_inlet]
        - ref: board_component_usb
          shift: [usb_breakout_offset_x + usb_plate_inlet, usb_breakout_y]
        - ref: board_component_mcu
          shift: [0 - 4, mcu_y + 2]
        - <<: *hole_top_inner_left
    - &board_back_fill_right_poly
      what: polygon
      points:
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_index_bottom
          shift: [0, -cutout_offset]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_board_component_usb
          shift: [usb_breakout_offset_x + usb_plate_inlet, 0 + usb_plate_inlet]
        - ref: mirror_board_component_usb
          shift: [usb_breakout_offset_x + usb_plate_inlet, usb_breakout_y]
        - ref: mirror_board_component_mcu
          shift: [0 - 4, mcu_y + 2]
        - <<: *hole_top_inner_right
      expand: 8
      fillet: 4
    - operation: subtract
      name: _holes
    - operation: subtract
      name: _holes_mcu_reset

  pcb:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - <<: *board_back_fill_left_poly
    - <<: *board_back_fill_right_poly
      expand: 6
      fillet: 6

  _top_plate_connect:
    - what: polygon
      points:
        - ref: matrix_index_home
          shift: [13.8, 0]
        - ref: matrix_index_home
          shift: [13.8, 2]
        - ref: mirror_matrix_index_home
          shift: [13.8, 2]
        - ref: mirror_matrix_index_home
          shift: [13.8, 0]

  _top_plate_2mm:
    - what: polygon
      points:
        - ref: matrix_index_home
          shift: [14.8, 0]
        - ref: matrix_index_home
          shift: [16.8, 0]
        - ref: matrix_index_home
          shift: [16.8, 2]
        - ref: matrix_index_home
          shift: [14.8, 2]

  top_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - &top_hole_back_fill_left_poly
      what: polygon
      points:
        - <<: *hole_top_inner_left
          shift: [13, 6]
        - ref: matrix_index_home
          shift: [0, 14]
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
    - &top_hole_back_fill_right_poly
      what: polygon
      points:
        - <<: *hole_top_inner_right
          shift: [13, 6]
        - ref: mirror_matrix_index_home
          shift: [0, 14]
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
      expand: 2
      fillet: 8
    - &usb_cable_clearance
      operation: subtract
      name: _usb_cable
      adjust:
        shift: [5.5, 0]
    - <<: *usb_cable_clearance
      adjust:
        shift: [-5.5, 0]
      expand: 5
      fillet: 5
    - &noop_outline
      what: rectangle
      where: "//"
      fillet: 2
    - operation: subtract
      name: _key_cutouts
    - operation: subtract
      name: _through_holes

  cover_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - <<: *top_hole_back_fill_left_poly
    - <<: *top_hole_back_fill_right_poly
      expand: 4
    - <<: *usb_cable_clearance
      adjust:
        shift: [4.5, 0]
    - <<: *usb_cable_clearance
      adjust:
        shift: [-4.5, 0]
      expand: 4
      fillet: 8
    - <<: *noop_outline
      fillet: 4
    - <<: *noop_outline
      fillet: 2
    - operation: subtract
      name: _key_cutouts
    - operation: subtract
      name: _through_holes

  mcu_cover:
    - &mcu_cover_left_poly
      what: polygon
      points:
        - <<: *hole_top_inner_left
        - <<: *hole_thumb_home_bottom_left
        - <<: *hole_mcu_cover_bottom_left
          shift: [-2.5 + usb_breakout_offset_x, 2.5 - 5]
        - <<: *hole_mcu_cover_middle_left
          shift: [-2.5 + usb_breakout_offset_x, usb_breakout_y]
        - <<: *hole_mcu_cover_top_left
    - &mcu_cover_right_poly
      what: polygon
      points:
        - <<: *hole_top_inner_right
        - <<: *hole_thumb_home_bottom_right
        - <<: *hole_mcu_cover_bottom_right
          shift: [-2.5 + usb_breakout_offset_x, 2.5 - 5]
        - <<: *hole_mcu_cover_middle_right
          shift: [-2.5 + usb_breakout_offset_x, usb_breakout_y]
        - <<: *hole_mcu_cover_top_right
      expand: 4
    - operation: subtract
      name: _through_holes

  full:
    - name: bottom_plate
    - name: keys
      operation: stack
    - name: _key_cutouts
      operation: stack
    - name: board
      operation: stack
    - name: _screws
      operation: stack
    - name: mcu_cover
      operation: stack

pcbs:
  main:
    outlines:
      main:
        outline: pcb
    footprints:
      # Left board switches (13 keys) - ordered by row then column
      # Top row: ring → middle → index (GP27-29)
      - &choc_switch
        where: matrix_ring_top
        what: choc
        params: &pcb_key_params
          keycaps: true
          hotswap: true
          from: L_GND
          to: L_GP7
      - where: matrix_middle_top
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP6 }
      - where: matrix_index_top
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP5 }
      # Home row: pinky → ring → middle → index (GP26, GP13-15)
      - where: matrix_pinky_home
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP11 }
      - where: matrix_ring_home
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP8 }
      - where: matrix_middle_home
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP9 }
      - where: matrix_index_home
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP10 }
      # Bottom row: pinky → ring → middle → index (GP9-12)
      - where: matrix_pinky_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP12 }
      - where: matrix_ring_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP13 }
      - where: matrix_middle_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP14 }
      - where: matrix_index_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP15 }
      # Thumb keys (GP7-8)
      - where: matrix_thumb_home_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP26 }
      - where: matrix_thumb_outer_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params, to: L_GP27 }

      # Right board switches (13 keys) - ordered by row then column
      # Top row: ring → middle → index (GP11-13)
      - where: mirror_matrix_ring_top
        <<: *choc_switch
        params: &pcb_key_params_right
          <<: *pcb_key_params
          from: R_GND
          to: R_GP15
      - where: mirror_matrix_middle_top
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP26 }
      - where: mirror_matrix_index_top
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP27 }
      # Home row: pinky → ring → middle → index (GP7-10)
      - where: mirror_matrix_pinky_home
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP11 }
      - where: mirror_matrix_ring_home
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP14 }
      - where: mirror_matrix_middle_home
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP13 }
      - where: mirror_matrix_index_home
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP12 }
      # Bottom row: pinky → ring → middle → index (GP3-6)
      - where: mirror_matrix_ring_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP10 }
      - where: mirror_matrix_middle_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP9 }
      - where: mirror_matrix_index_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP8 }
      # Thumb keys (GP14-15)
      - where: mirror_matrix_thumb_home_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP7 }
      - where: mirror_matrix_thumb_outer_bottom
        <<: *choc_switch
        params: { <<: *pcb_key_params_right, to: R_GP6 }

      # Left MCU with L_ prefixed nets
      - what: rp2040
        params:
          side: "B"
          reverse: true
          P5V: L_P5V_IN
          GND: L_GND
          P3V3: L_P3V3
          GP0: L_GP0
          GP1: L_GP1
          GP2: L_GP2
          GP3: L_GP3
          GP4: L_GP4
          GP5: L_GP5
          GP6: L_GP6
          GP7: L_GP7
          GP8: L_GP8
          GP9: L_GP9
          GP10: L_GP10
          GP11: L_GP11
          GP12: L_GP12
          GP13: L_GP13
          GP14: L_GP14
          GP15: L_GP15
          GP26: L_GP26
          GP27: L_GP27
          GP28: L_DP
          GP29: L_GP29
        where:
          ref: board_component_mcu
          shift: [ -mcu_x + -mcu_offset + 0.25, mcu_y + mcu_offset ]
          rotate: -90

      # Right MCU with R_ prefixed nets
      - what: rp2040
        params:
          side: "B"
          reverse: true
          P5V: R_P5V
          GND: R_GND
          P3V3: R_P3V3
          GP0: R_GP0
          GP1: R_GP1
          GP2: R_GP2
          GP3: R_GP3
          GP4: R_DP
          GP5: R_GP5
          GP6: R_GP6
          GP7: R_GP7
          GP8: R_GP8
          GP9: R_GP9
          GP10: R_GP10
          GP11: R_GP11
          GP12: R_GP12
          GP13: R_GP13
          GP14: R_GP14
          GP15: R_GP15
          GP26: R_GP26
          GP27: R_GP27
          GP28: R_GP28
          GP29: R_GP29
        where:
          ref: mirror_board_component_mcu
          shift: [ -mcu_x + -mcu_offset + 0.25, -mcu_offset ]
          rotate: -90

      # Left USB-C breakout
      - what: usbc_breakout
        params:
          side: "B"
          GND: L_GND
          VBUS: L_P5V
          CC1: L_CC1
          CC2: L_CC2
          DP: L_DP
          DN: L_DN
          SBU1: L_SBU1
          SBU2: L_SBU2
        where:
          ref: board_component_usb
          shift: [ -usb_breakout_x/2 + usb_breakout_offset_x, usb_breakout_y/2 ]
          rotate: 90

      # Right USB-C breakout
      - what: usbc_breakout
        params:
          side: "B"
          GND: R_GND
          VBUS: R_P5V_IN
          CC1: R_CC1
          CC2: R_CC2
          DP: R_DP
          DN: R_DN
          SBU1: R_SBU1
          SBU2: R_SBU2
        where:
          ref: mirror_board_component_usb
          shift: [ -usb_breakout_x/2 + usb_breakout_offset_x, usb_breakout_y/2 ]
          rotate: 90

      - &npth_2_5
        what: npth
        params:
          hole_size: 2.9
          hole_drill: 2.9
        where: *hole_pinky_home_left
      - <<: *npth_2_5
        where: *hole_ring_top_left
      - <<: *npth_2_5
        where: *hole_ring_bottom_left
      - <<: *npth_2_5
        where: *hole_index_bottom_left
      - <<: *npth_2_5
        where: *hole_top_inner_left
      - <<: *npth_2_5
        where: *hole_thumb_home_bottom_left
      - <<: *npth_2_5
        where: *hole_mcu_cover_top_left
      - <<: *npth_2_5
        where: *hole_mcu_cover_middle_left
      - <<: *npth_2_5
