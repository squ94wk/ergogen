meta:
  engine: "4.0.0"

units:
  kx: cx # 18
  ky: cy # 17
  cap_x: cx - 0.5
  cap_y: cy - 0.5
  cutout: 13.8
  cutout_offset: cutout / 2
  mcu_x: 18
  mcu_y: 23.5
  mcu_offset: 1.2

points:
  key:
    padding: 1 ky
    spread: 1 kx
  zones:
    matrix:
      anchor:
        shift: [ 100, -100 ]
      rows:
        bottom: {}
        home: {}
        top: {}
      columns:
        pinky:
          rows:
            top:
              skip: true
            home: {}
            bottom:
              asym: source
          key:
            splay: 4
        ring:
          rows: {}
          key:
            splay: -2
            spread: 1 kx + 1
            stagger: 9
        middle:
          rows: {}
          key:
            splay: -2
            spread: 1 kx + 1
            stagger: 3
        index:
          rows: {}
          key:
            splay: -1
            spread: kx + 1
            stagger: -2
        thumb_home:
          rows:
            bottom: {}
            home:
              skip: true
            top:
              skip: true
          key:
            splay: -10
            stagger: -1.2ky
            spread: 0.75 kx
        thumb_outer:
          rows:
            bottom: {}
            home:
              skip: true
            top:
              skip: true
          key:
            splay: -4
            stagger: -0.75
            spread: 1 kx + 1

    board:
      anchor:
        ref: matrix_index_home
        shift: [kx/2 + 6 + mcu_x, -14] # 6mm off the key
      key:
        padding: 0
        spread: 0
      columns:
        component:
          rows:
            mcu: {}
            trrs:
              shift: [0, -7.5] # 7.5mm below mcu

  mirror:
    ref: matrix_index_home
    distance: 110

outlines:
  keys:
    - what: rectangle
      where: "/matrix/"
      joints: 1
      size: [cap_x, cap_y]
      corner: 1

  _key_cutouts:
    - what: rectangle
      where: "/matrix/"
      joints: 1
      size: [cutout, cutout]

  _board:
    - what: rectangle
      where: "/board_component_mcu/"
      joints: 1
      size: [mcu_x, mcu_y]
      adjust:
        shift: [-mcu_x/2, mcu_y/2] # origin is bottom right
    - what: rectangle
      where: "/board_component_trrs/"
      joints: 1
      size: [14, 6]
      adjust:
        shift: [-7, 3] # origin is bottom right
    - what: rectangle # protruding USB connector
      where: "/board_component_mcu/"
      joints: 1
      size: [8.63, 1]
      adjust:
        shift: [-mcu_x/2, mcu_y + 0.5] # center of MCU top

  _usb_cable:
    - what: rectangle # USB cable
      where: "/board_component_mcu/"
      joints: 1
      size: [12, 19]
      adjust:
        shift: [-mcu_x/2, mcu_y + 1 + 19/2] # starting at USB connector

  board:
    - name: _board
    - name: _usb_cable

  _hull_left:
    - &hull_left_poly
      what: polygon
      points:
        - ref: matrix_pinky_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: matrix_pinky_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_home_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_thumb_home_bottom
          shift: [-cutout_offset + 6, cutout_offset]
        - ref: matrix_index_bottom
          shift: [cutout_offset, 0]
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  _hull_right:
    - &hull_right_poly
      what: polygon
      points:
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_home_bottom
          shift: [-cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, -cutout_offset]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_thumb_home_bottom
          shift: [-cutout_offset + 6, cutout_offset]
        - ref: mirror_matrix_index_bottom
          shift: [cutout_offset, 0]
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_middle_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_ring_top
          shift: [-cutout_offset, cutout_offset]
        - ref: mirror_matrix_pinky_home
          shift: [-cutout_offset, cutout_offset]

  _holes:
    - &m25_hole
      what: circle
      where: &hole_pinky_home_left
        ref: matrix_pinky_home
        shift: [-5, 14]
      radius: 2.2/2
    - <<: *m25_hole
      where: &hole_ring_top_left
        ref: matrix_ring_top
        shift: [-13, 3]
    - <<: *m25_hole
      where: &hole_ring_bottom_left
        ref: matrix_ring_bottom
        shift: [-7, -19.75]
    - <<: *m25_hole
      where: &hole_index_bottom_left
        ref: matrix_thumb_home_bottom
        shift: [-13, -9.75]
    - <<: *m25_hole
      where: &hole_top_inner_left
        ref: matrix_index_top
        shift: [13, 6]
    - <<: *m25_hole
      where: &hole_thumb_home_bottom_left
        ref: matrix_thumb_home_bottom
        shift: [-2, 15]
    # right side
    - <<: *m25_hole
      where: &hole_pinky_home_right
        ref: mirror_matrix_pinky_home
        shift: [-5, 14]
    - <<: *m25_hole
      where: &hole_pinky_bottom_right
        ref: mirror_matrix_pinky_home
        shift: [4, -14.5]
    - <<: *m25_hole
      where: &hole_ring_top_right
        ref: mirror_matrix_ring_top
        shift: [-13, 3]
    - <<: *m25_hole
      where: &hole_index_bottom_right
        ref: mirror_matrix_thumb_home_bottom
        shift: [-13, -9]
    - <<: *m25_hole
      where: &hole_top_inner_right
        ref: mirror_matrix_index_top
        shift: [13, 6]
    - <<: *m25_hole
      where: &hole_thumb_home_bottom_right
        ref: mirror_matrix_thumb_home_bottom
        shift: [-2, 15]

  _through_holes:
    - name: _holes
      expand: 0.2 # 2.9

  _screws:
    - name: _holes
      expand: 1.25 # 4.7

  bottom_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - &board_back_fill_left_poly
      what: polygon
      points:
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: matrix_thumb_home_bottom
          shift: [-cutout_offset, 0]
        - ref: matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: board_component_mcu
          shift: [0, mcu_y]
        - <<: *hole_top_inner_left
    - &board_back_fill_right_poly
      what: polygon
      points:
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_matrix_thumb_home_bottom
          shift: [-cutout_offset, 0]
        - ref: mirror_matrix_thumb_outer_bottom
          shift: [cutout_offset, cutout_offset]
        - ref: mirror_board_component_mcu
          shift: [0, mcu_y]
        - <<: *hole_top_inner_right
      expand: 8
    - operation: subtract
      name: _holes

  pcb:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - <<: *board_back_fill_left_poly
    - <<: *board_back_fill_right_poly
      expand: 7
      fillet: 7

  top_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - &top_hole_back_fill_left_poly
      what: polygon
      points:
        - <<: *hole_top_inner_left
        - ref: matrix_index_home
        - ref: matrix_index_top
          shift: [cutout_offset, cutout_offset]
    - &top_hole_back_fill_right_poly
      what: polygon
      points:
        - <<: *hole_top_inner_right
        - ref: mirror_matrix_index_home
        - ref: mirror_matrix_index_top
          shift: [cutout_offset, cutout_offset]
      expand: 2
      fillet: 8
    - &usb_cable_clearance
      operation: subtract
      name: _usb_cable
      adjust:
        shift: [5.5, 0]
    - <<: *usb_cable_clearance
      adjust:
        shift: [-5.5, 0]
      expand: 5
      fillet: 5
    - &noop_outline
      what: rectangle
      where: "//"
      fillet: 2
    - operation: subtract
      name: _key_cutouts
    - operation: stack
      name: board
    - operation: subtract
      name: _through_holes

  cover_plate:
    - <<: *hull_left_poly
    - <<: *hull_right_poly
    - <<: *top_hole_back_fill_left_poly
    - <<: *top_hole_back_fill_right_poly
      expand: 4
    - <<: *usb_cable_clearance
      adjust:
        shift: [4.5, 0]
    - <<: *usb_cable_clearance
      adjust:
        shift: [-4.5, 0]
      expand: 4
      fillet: 8
    - <<: *noop_outline
      fillet: 4
    - <<: *noop_outline
      fillet: 2
    - operation: subtract
      name: _key_cutouts
    - operation: stack
      name: keys
    - operation: subtract
      name: _holes
    - operation: stack
      name: board
    - operation: stack
      name: _screws

pcbs:
  main:
    outlines:
      main:
        outline: pcb
    footprints:
      - what: choc
        where: "/matrix/"
        params:
          keycaps: true
          hotswap: true
          reverse: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      - what: trrs
        where:
          ref: board_component_trrs
          shift: [ 0, 3 ]
          rotate: -90
        params:
          side: "F"
          symmetric: false
      - what: trrs
        where:
          ref: mirror_board_component_trrs
          shift: [ 0, 3 ]
          rotate: -90
        params:
          side: "F"
          symmetric: false
      - what: rp2040
        params:
          side: "B"
          reverse: true
        where:
          ref: board_component_mcu
          shift: [ -18 - mcu_offset, -mcu_offset ]
      - what: rp2040
        params:
          side: "B"
          reverse: true
        where:
          ref: mirror_board_component_mcu
          shift: [ mcu_offset, -mcu_offset ]
      - &npth_3mm
        what: npth
        params:
          hole_size: 3
          hole_drill: 3
        where: *hole_pinky_home_left
      - <<: *npth_3mm
        where: *hole_ring_top_left
      - <<: *npth_3mm
        where: *hole_ring_bottom_left
      - <<: *npth_3mm
        where: *hole_index_bottom_left
      - <<: *npth_3mm
        where: *hole_top_inner_left
      - <<: *npth_3mm
        where: *hole_thumb_home_bottom_left
      - <<: *npth_3mm
        where: *hole_pinky_home_right
      - <<: *npth_3mm
        where: *hole_pinky_bottom_right
      - <<: *npth_3mm
        where: *hole_ring_top_right
      - <<: *npth_3mm
        where: *hole_index_bottom_right
      - <<: *npth_3mm
        where: *hole_top_inner_right
      - <<: *npth_3mm
        where: *hole_thumb_home_bottom_right
